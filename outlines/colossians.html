    <div class="message-grid">

        <!-- PART 1 -->
        <div class="message-section">
            <h3>Colossians 1</h3>

            <a href="messages/Colossians_Overview.html">
                <span class="passage">Overview</span>
                <span class="title">Colossians Overview</span>
            </a>

            <a href="messages/colossians-1-1-6.html">

            <a href="messages/colossians-1-7-14.html">

                <span class="title">Name of Message</span>
            </a>
        </div>



<script>


const menuButton =
document.querySelector(".menu-button");


const menu =
document.querySelector(".menu");


const overlay =
document.querySelector(".menu-overlay");



menuButton.onclick = () => {

menu.classList.toggle("active");

overlay.classList.toggle("active");

};



overlay.onclick = () => {

menu.classList.remove("active");

overlay.classList.remove("active");

};





const aboutSection =
document.querySelector(".about");


const observer =
new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){

aboutSection.classList.add("show");

}


});


},{
threshold:.3
});



observer.observe(aboutSection);



</script>
