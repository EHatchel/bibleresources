<script>
const menuButton = document.querySelector(".menu-button");
const menu = document.querySelector(".menu");
const overlay = document.querySelector(".menu-overlay");

// Open menu
function openMenu() {
    menu.classList.add("active");
    overlay.classList.add("active");
}

// Close menu
function closeMenu() {
    menu.classList.remove("active");
    overlay.classList.remove("active");
}

// Keep click functionality
menuButton.onclick = () => {
    if (menu.classList.contains("active")) {
        closeMenu();
    } else {
        openMenu();
    }
};

// Open on hover (desktop)
menuButton.addEventListener("mouseenter", openMenu);
menu.addEventListener("mouseenter", openMenu);

// Close when mouse leaves the menu
menu.addEventListener("mouseleave", closeMenu);

// Close when clicking the overlay
overlay.onclick = closeMenu;
</script>

<!-- CHOOSE BOOK DROPDOWN -->

<script>

const bookSelect = document.getElementById("bookSelect");
const chapterSelect = document.getElementById("chapterSelect");
const goButton = document.getElementById("goButton");


const chapters = {
    "jonah": 4,
    "Matthew": 28,
    "ephesians": 6,
    "colossians": 4,
    "1_timothy": 6,
    "philemon": 1
};


// When a book is selected

bookSelect.addEventListener("change", function () {

    const book = this.value;

    // Reset chapters

    chapterSelect.innerHTML =
        '<option value="">Select a chapter</option>';


    if (book && chapters[book]) {

        // Add the chapters for the selected book

        for (let i = 1; i <= chapters[book]; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = `Chapter ${i}`;

            chapterSelect.appendChild(option);

        }

        chapterSelect.disabled = false;

        // Enable Go as soon as a book is selected

        goButton.disabled = false;

    } else {

        chapterSelect.disabled = true;

        goButton.disabled = true;

    }

});


// Go button

goButton.addEventListener("click", function () {

    const book = bookSelect.value;
    const chapter = chapterSelect.value;


    // If both book AND chapter are selected,
    // go directly to that chapter.

    if (book && chapter) {

        window.location.href =
            `${book}.html#chapter-${chapter}`;

    }


    // If only a book is selected,
    // go to the beginning of that book's outline.

    else if (book) {

        window.location.href =
            `${book}.html`;

    }

});

</script>
