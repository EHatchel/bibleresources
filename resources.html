<section class="resources-section">

    <div class="resources-container">

        <div class="resource-grid">

           <a href="https://www.bible.com/" class="resource-card" target="_blank">

         <div class="resource-image">
             <img src="images/bible_app.png" alt="BibleApp">

           <div class="resource-overlay">
               <h2>The Bible App</h2>
               <p>The easiest way to access the Bible from your phone.</p>
               <span>Visit Resource →</span>
        </div>
      </div>

    <h2 class="resource-mobile-name">The Bible App</h2>

         </a>

            <a href="https://example.com" class="resource-card" target="_blank">
            <img src="images/resource2.jpg" alt="Resource 2">

            <div class="resource-overlay">
                <h2>Another Resource</h2>
                <p>Helpful tools for studying Scripture</p>
                <span>Visit Resource →</span>
            </div>
             
        </a>

         <a href="https://example.com" class="resource-card" target="_blank">
            <img src="images/resource3.jpg" alt="Resource 3">

            <div class="resource-overlay">
                <h2>Third Resource</h2>
                <p>Additional Bible study resources</p>
                <span>Visit Resource →</span>
            </div>
        </a>
         
        </div>

    </div>

</section>
 

<script>


const menuButton =
document.querySelector(".menu-button");


const menu =
document.querySelector(".menu");


const overlay =
document.querySelector(".menu-overlay");



menuButton.onclick = () => {

menu.classList.toggle("active");

overlay.classList.toggle("active");

};



overlay.onclick = () => {

menu.classList.remove("active");

overlay.classList.remove("active");

};





const aboutSection =
document.querySelector(".about");


const observer =
new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){

aboutSection.classList.add("show");

}


});


},{
threshold:.3
});



observer.observe(aboutSection);



</script>
