<!-- RESOURCES -->
 
<section class="resources-section">

 <div class="resources-grid">
        <a href="https://www.bible.com/" class="resource-card" target="_blank">
            <div class="resource-image">
                <img src="images/bible_app.png" alt="Bible App">

                <div class="resource-overlay">
                    <h3>The Bible App</h3>
                    <p>Easy way to access the Bible on the go.</p>
                </div>
            </div>

            <h3 class="mobile-resource-name">The Bible App</h3>
        </a>

 <a href="https://www.gotquestions.org/" class="resource-card" target="_blank">
            <div class="resource-image">
                <img src="images/got_questions.jpg" alt="Got Questions">

                <div class="resource-overlay">
                    <h3>Got Questions</h3>
                    <p>A great place to ask your Godly questions.</p>
                </div>
            </div>

            <h3 class="mobile-resource-name">Got Questions</h3>
        </a>


  
</section>
 

<script>


const menuButton =
document.querySelector(".menu-button");


const menu =
document.querySelector(".menu");


const overlay =
document.querySelector(".menu-overlay");



menuButton.onclick = () => {

menu.classList.toggle("active");

overlay.classList.toggle("active");

};



overlay.onclick = () => {

menu.classList.remove("active");

overlay.classList.remove("active");

};





const aboutSection =
document.querySelector(".about");


const observer =
new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){

aboutSection.classList.add("show");

}


});


},{
threshold:.3
});



observer.observe(aboutSection);



</script>
