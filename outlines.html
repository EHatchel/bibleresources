<!-- HERO -->


<section class="hero">




<h1>
Outlines
</h1>


</section>


<!-- OUTLINE LIST -->
<section>

<div class="study-selector">

  <h3>
   What are we studying today?
  </h3>
 
</div> 

 <div class="study-selector">

    <label for="bookSelect">Book</label>
    <select id="bookSelect">
        <option value="">Select a book</option>
        <option value="ephesians">Ephesians</option>
        <option value="philippians">Philippians</option>
        <option value="colossians">Colossians</option>
        <option value="1-timothy">1 Timothy</option>
        <option value="philemon">Philemon</option>
    </select>

    <label for="chapterSelect">Chapter</label>
    <select id="chapterSelect" disabled>
        <option value="">Select a chapter</option>
    </select>

    <button id="goButton" disabled>Go</button>

</div>
 
</section>

 
<script>


const menuButton =
document.querySelector(".menu-button");


const menu =
document.querySelector(".menu");


const overlay =
document.querySelector(".menu-overlay");



menuButton.onclick = () => {

menu.classList.toggle("active");

overlay.classList.toggle("active");

};



overlay.onclick = () => {

menu.classList.remove("active");

overlay.classList.remove("active");

};





const aboutSection =
document.querySelector(".about");


const observer =
new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){

aboutSection.classList.add("show");

}


});


},{
threshold:.3
});



observer.observe(aboutSection);



</script>

<!-- CHOOSE BOOK DROPDOWN -->
<script>
const bookSelect = document.getElementById("bookSelect");
const chapterSelect = document.getElementById("chapterSelect");
const goButton = document.getElementById("goButton");

const chapters = {
    "ephesians": 6,
    "philippians": 4,
    "colossians": 4,
    "1-timothy": 6,
    "philemon": 1
};

bookSelect.addEventListener("change", function () {

    const book = this.value;

    chapterSelect.innerHTML =
        '<option value="">Select a chapter</option>';

    if (book && chapters[book]) {

        for (let i = 1; i <= chapters[book]; i++) {

            const option = document.createElement("option");

            option.value = i;
            option.textContent = `Chapter ${i}`;

            chapterSelect.appendChild(option);
        }

        chapterSelect.disabled = false;

    } else {

        chapterSelect.disabled = true;
        goButton.disabled = true;
    }
});


chapterSelect.addEventListener("change", function () {

    goButton.disabled = !this.value;

});


goButton.addEventListener("click", function () {

    const book = bookSelect.value;
    const chapter = chapterSelect.value;

    if (book && chapter) {

        window.location.href =
            `outlines/${book}.html#chapter-${chapter}`;

    }

});
</script>

</body>
