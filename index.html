<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible Commentaries and Curriculums</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    height: 100vh;
    width: 100%;
    overflow: hidden;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("background.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    animation: pageFade 1.5s ease forwards;

}



.hero {

    text-align: center;
    color: white;

}



.hero h1 {

    font-size: clamp(2.5rem, 6vw, 5rem);

    font-weight: 600;

    letter-spacing: 1px;

    opacity: 0;

    animation:
    textFade 1.5s ease forwards;

    animation-delay: .8s;

}



@keyframes pageFade {

from {

    opacity: 0;

}

to {

    opacity: 1;

}

}



@keyframes textFade {

from {

    opacity: 0;

    transform:
    translateY(25px);

}


to {

    opacity: 1;

    transform:
    translateY(0);

}

}



</style>

</head>


<body>


<div class="hero">

<h1>
Bible Commentaries and Curriculums
</h1>

</div>


</body>

</html>
