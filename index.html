<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible Commentaries and Curriculums</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    font-family: Arial, Helvetica, sans-serif;

    background: #111;

    color: white;

}



/* HERO SECTION */

.hero {

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

}



.background {

    position: absolute;

    height: 110%;
    width: 110%;

    top: -5%;
    left: -5%;

    background-size: cover;

    background-position: center;

    filter: grayscale(100%);

    animation:
    imageFade 30s infinite,
    slowZoom 30s infinite;

    z-index: -2;

}



.hero::before {

    content: "";

    position: absolute;

    inset: 0;

    background: rgba(0,0,0,.65);

    z-index: -1;

}



.hero h1 {

    font-size: clamp(2.5rem,6vw,5rem);

    text-align:center;

    max-width: 1000px;

    opacity: 1;

    transition:
    opacity 1s ease,
    transform 1s ease;

}



/* ABOUT SECTION */

.about {

    min-height: 80vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:40px;

}



.about h2 {

    font-size:clamp(2rem,5vw,4rem);

    margin-bottom:20px;

    opacity:0;

    transform:translateY(40px);

    transition:
    opacity 1.2s ease,
    transform 1.2s ease;

}



.about p {

    max-width:700px;

    font-size:1.2rem;

    line-height:1.7;

    color:#ccc;

    opacity:0;

    transform:translateY(40px);

    transition:
    opacity 1.2s ease .2s,
    transform 1.2s ease .2s;

}




/* ACTIVE STATES */

.show {

    opacity:1 !important;

    transform:translateY(0) !important;

}



.hide {

    opacity:0;

    transform:translateY(-50px);

}





/* BACKGROUND ANIMATION */


@keyframes imageFade {


0% {

background-image:url("images/group 1.jpeg");

}


33% {

background-image:url("images/group 2.jpg");

}


66% {

background-image:url("images/group 3.jpeg");

}


100% {

background-image:url("images/group 1.jpeg");

}


}



@keyframes slowZoom {

from {

transform:scale(1);

}

to {

transform:scale(1.08);

}

}


</style>


</head>


<body>



<section class="hero">


<div class="background"></div>


<h1 id="heroTitle">
Bible Commentaries and Curriculums
</h1>


</section>




<section class="about">


<h2>
About Us
</h2>


<p>
This is my small about us text
</p>


</section>





<script>


const heroTitle = document.getElementById("heroTitle");

const aboutElements =
document.querySelectorAll(".about h2, .about p");



window.addEventListener("scroll", () => {


let scrollPosition =
window.scrollY;



let screenHeight =
window.innerHeight;



if(scrollPosition > screenHeight * .35) {


heroTitle.classList.add("hide");


}
else {


heroTitle.classList.remove("hide");


}





aboutElements.forEach(element => {


let position =
element.getBoundingClientRect().top;



if(position < screenHeight * .75) {


element.classList.add("show");


}


});


});



</script>



</body>

</html>
