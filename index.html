<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible Commentaries and Curriculums</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    height: 100vh;
    width: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    background: black;

    animation: pageFade 2s ease forwards;

}



/* Background images */

.background {

    position: absolute;

    height: 110%;
    width: 110%;

    top: -5%;
    left: -5%;

    background-size: cover;
    background-position: center;

    filter: grayscale(100%);

    animation:
        imageFade 30s infinite,
        slowZoom 30s infinite;

    z-index: -2;

}



/* Second dark layer for text readability */

body::before {

    content: "";

    position: absolute;

    height: 100%;
    width: 100%;

    background:
    rgba(0,0,0,0.65);

    z-index: -1;

}




@keyframes imageFade {


0% {

    opacity: 1;

    background-image:
    url("images/group 1.jpeg");

}


30% {

    opacity: 1;

    background-image:
    url("images/group 1.jpeg");

}


33% {

    opacity: 0;

}


36% {

    opacity: 1;

    background-image:
    url("images/group 2.jpg");

}


63% {

    opacity: 1;

    background-image:
    url("images/group 2.jpg");

}


66% {

    opacity: 0;

}


69% {

    opacity: 1;

    background-image:
    url("images/group 3.jpeg");

}


96% {

    opacity: 1;

    background-image:
    url("images/group 3.jpeg");

}


100% {

    opacity: 1;

    background-image:
    url("images/group 1.jpeg");

}


}




@keyframes slowZoom {

from {

    transform: scale(1);

}


to {

    transform: scale(1.08);

}

}




.hero {

    text-align: center;

    color: white;

    padding: 20px;

}



.hero h1 {

    font-size:
    clamp(2.5rem, 6vw, 5rem);

    font-weight: 600;

    letter-spacing: 1px;

    opacity: 0;

    animation:

    textFade 2s ease forwards;

    animation-delay: 1s;

}




@keyframes pageFade {

from {

opacity:0;

}

to {

opacity:1;

}

}





@keyframes textFade {


from {

opacity:0;

transform: translateY(30px);

}


to {

opacity:1;

transform: translateY(0);

}


}



</style>


</head>


<body>


<div class="background"></div>


<div class="hero">

<h1>
Bible Commentaries and Curriculums
</h1>

</div>


</body>

</html>
