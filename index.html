<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible Commentaries and Curriculums</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {

    height: 100vh;
    width: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    background: black;

    animation: pageFade 2s ease forwards;

}



/* Background layers */

.background {

    position: absolute;

    height: 110%;
    width: 110%;

    top: -5%;
    left: -5%;

    background-size: cover;
    background-position: center;

    filter: grayscale(100%);

    z-index: 0;

}



/* Image 1 */

.background.one {

    background-image:
    url("images/group_1.jpeg");

    animation:
    crossfadeOne 30s infinite,
    slowZoom 30s infinite;

}



/* Image 2 */

.background.two {

    background-image:
    url("images/group_2.jpg");

    animation:
    crossfadeTwo 30s infinite,
    slowZoom 30s infinite;

}



/* Image 3 */

.background.three {

    background-image:
    url("images/group_3.jpeg");

    animation:
    crossfadeThree 30s infinite,
    slowZoom 30s infinite;

}




/* Dark overlay */

body::before {

    content: "";

    position: absolute;

    height: 100%;
    width: 100%;

    background:
    rgba(0,0,0,0.65);

    z-index: 5;

}




/* Crossfade animations */

@keyframes crossfadeOne {


0%, 30% {

    opacity: 1;

}


33%, 100% {

    opacity: 0;

}


}



@keyframes crossfadeTwo {


0%, 33% {

    opacity: 0;

}


36%, 63% {

    opacity: 1;

}


66%, 100% {

    opacity: 0;

}


}



@keyframes crossfadeThree {


0%, 66% {

    opacity: 0;

}


69%, 96% {

    opacity: 1;

}


100% {

    opacity: 0;

}


}




/* Slow camera movement */

@keyframes slowZoom {


from {

    transform: scale(1);

}


to {

    transform: scale(1.08);

}


}




/* Main text */

.hero {

    text-align: center;

    color: white;

    padding: 20px;

    position: relative;

    z-index: 10;

}



.hero h1 {

    font-size:
    clamp(2.5rem, 6vw, 5rem);

    font-weight: 600;

    letter-spacing: 1px;

    opacity: 0;

    animation:

    textFade 2s ease forwards;

    animation-delay: 1s;

}




/* Page fade */

@keyframes pageFade {

from {

opacity:0;

}

to {

opacity:1;

}

}




/* Text entrance */

@keyframes textFade {


from {

opacity:0;

transform: translateY(30px);

}


to {

opacity:1;

transform: translateY(0);

}


}



</style>


</head>


<body>


<div class="background one"></div>

<div class="background two"></div>

<div class="background three"></div>



<div class="hero">

<h1>
Bible Commentaries and Curriculums
</h1>

</div>


</body>

</html>
